<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="libs/bootstrap.min.css">
    <link rel="stylesheet" href="libs/jquery.dataTables.min.css">
</head>
<body>

    <div class="container mt-5">
        <div class="row">
            <div id="inicioSesion">
                <h2>Login</h2>
                <form id="formularioInicioSesion">
                    <div class="mb-3">
                        <label for="inicioSesionEmail" class="form-label">Email</label>
                        <input type="text" class="form-control" id="inicioSesionEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="inicioSesionContraseña" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="inicioSesionContraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Iniciar sesión</button>
                </form>
                <h5 class="py-2">¿No tienes cuenta? <span class="irRegistro" id="irRegistro">Registrate</span></h5>
            </div>
    
            <div id="registro">
                <h2>Register</h2>
                <form id="formularioRegistro">
                    <div class="mb-3">
                        <label for="registroNombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="registroNombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="registroEmail" class="form-label">Email</label>
                        <input type="text" class="form-control" id="registroEmail" required>
                    </div>
                    <div class="mb-3">
                        <label for="registroContraseña" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="registroContraseña" required>
                    </div>
                    <div class="mb-3">
                        <label for="repetirContraseña" class="form-label">Repetir Contraseña</label>
                        <input type="password" class="form-control" id="contraseñaRepetida" required>
                    </div>
                    <button type="submit" class="btn btn-success">Registrarse</button>
                </form>
                <h5 class="py-2">¿Ya tienes una cuenta? <span class="irInicioSesion" id="irInicioSesion">Inicia sesión</span></h5>
            </div>
        </div>
    </div>


    <script src="libs/jquery-3.6.0.min.js"></script>
    <script src="libs/bootstrap.bundle.min.js"></script>
    <script src="libs/jquery.dataTables.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
